name: Sync registered teams

on:
  schedule:
    - cron: "59 23 * * *"
      timezone: Asia/Shanghai
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: sync-registered-teams
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Fast-forward to remote main
        run: git pull --ff-only origin main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r scripts/requirements.txt

      - name: Test synchronizer
        run: python -m unittest discover -s tests -v

      - name: Read registration sheet
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python scripts/sync_registered_teams.py

      - name: Commit and push changes
        id: commit
        run: |
          if [ -z "$(git status --porcelain -- data/registered-teams.txt)" ]; then
            echo "Team list unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/registered-teams.txt
          git commit -m "Sync registered teams from registration sheet"
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Rebuild GitHub Pages
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages/builds"
